# Regenerates every results/ folder with the full settings and commits the output,
# so the numbers in the READMEs always match the code. Runs when analysis code on
# main changes, once a month, or on demand from the Actions tab.
name: Full run

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of each month
  push:
    branches: [main]
    paths:
      - "survival-ml-pbc/src/**"
      - "polymer-monte-carlo/polymc/**"
      - "polymer-monte-carlo/scripts/**"
      - "heart-failure-ml/src/**"
      - "**/requirements.txt"

permissions:
  contents: write

concurrency:
  group: full-run
  cancel-in-progress: true

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: survival-ml-pbc
            cmd: python src/run.py --jobs 4
          - project: polymer-monte-carlo
            cmd: python scripts/run_free_chain.py && python scripts/run_adsorption.py
          - project: heart-failure-ml
            cmd: python src/run.py --jobs 4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Full analysis
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: full-results-${{ matrix.project }}
          path: ${{ matrix.project }}/results

  commit:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Copy results into the repo
        run: |
          for p in survival-ml-pbc polymer-monte-carlo heart-failure-ml; do
            rm -rf "$p/results" && cp -r "artifacts/full-results-$p" "$p/results"
          done
          rm -rf artifacts
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A */results
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Regenerate results (full run) [skip ci]"
          git push
